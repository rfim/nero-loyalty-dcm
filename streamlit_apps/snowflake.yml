definition_version: "2"
entities:
  # ---------------- dashboards (NERO_GOVERNANCE.APPS_DASHBOARDS) ----------------
  loyalty_engagement_sales:
    # Renamed from loyalty_trading_pulse; rebuilt around the exercise's
    # Part 4 brief -- 3 sections, one per stakeholder question -- and
    # fixed to read "01_BRONZE" (was querying the retired "01_SILVER"/
    # VALIDATED_* schema after the Staging/Bronze/Silver rename).
    type: streamlit
    identifier: {name: LOYALTY_ENGAGEMENT_SALES, schema: APPS_DASHBOARDS, database: NERO_GOVERNANCE}
    stage: streamlit_stage
    query_warehouse: NERO_BI_WH
    main_file: dashboards/loyalty_engagement_sales/loyalty_engagement_sales.py
    artifacts:
      - dashboards/loyalty_engagement_sales/loyalty_engagement_sales.py
      - dashboards/loyalty_engagement_sales/dashboard_template.html
      - shared/branding.py
      - shared/assets/caffe_nero_logo.png
    title: "Loyalty Engagement & Sales"

  platform_governance:
    # Replaces the 4 separate entities this used to be (cost_reports,
    # security_governance_report, pipeline_health, and now
    # chatbot_security_report) -- one app, six tabs (Pipeline Health,
    # Security & Governance, Data Quality, Platform Cost, Chatbot Cost,
    # Chatbot Security). Deploying this entity with --replace overwrites
    # the existing PLATFORM_GOVERNANCE object if already deployed; the old
    # standalone objects are separate objects this doesn't touch and must
    # be dropped explicitly once each merge is verified live.
    type: streamlit
    identifier: {name: PLATFORM_GOVERNANCE, schema: APPS_DASHBOARDS, database: NERO_GOVERNANCE}
    stage: streamlit_stage
    query_warehouse: NERO_BI_WH
    external_access_integrations: [NERO_PYPI_ACCESS_INTEGRATION]
    main_file: dashboards/platform_governance/platform_governance.py
    artifacts:
      - dashboards/platform_governance/platform_governance.py
      - dashboards/platform_governance/pipeline_health_template.html
      - dashboards/platform_governance/security_dashboard_template.html
      - dashboards/platform_governance/quality_dashboard_template.html
      - dashboards/platform_governance/cost_dashboard_template.html
      - dashboards/platform_governance/chatbot_cost_dashboard_template.html
      - dashboards/platform_governance/chatbot_security_dashboard_template.html
      - shared/report_common.py
      - shared/branding.py
      - shared/assets/caffe_nero_logo.png
      - dashboards/platform_governance/requirements.txt
    title: "Platform Governance"

  # ---------------- chatbots (NERO_GOVERNANCE.APPS_CHATBOTS) ----------------
  nero_assistant:
    type: streamlit
    identifier: {name: NERO_ASSISTANT, schema: APPS_CHATBOTS, database: NERO_GOVERNANCE}
    stage: streamlit_stage
    query_warehouse: NERO_BI_WH
    main_file: chatbots/nero_assistant/nero_assistant.py
    artifacts:
      - chatbots/nero_assistant/nero_assistant.py
      - shared/chat_store.py
      - shared/chat_export.py
      - shared/branding.py
      - shared/assets/caffe_nero_logo.png
      - chatbots/nero_assistant/requirements.txt
    title: "Nero Assistant"

  nero_governance_assistant:
    type: streamlit
    identifier: {name: NERO_GOVERNANCE_ASSISTANT, schema: APPS_CHATBOTS, database: NERO_GOVERNANCE}
    stage: streamlit_stage
    query_warehouse: NERO_BI_WH
    main_file: chatbots/nero_governance_assistant/nero_governance_assistant.py
    artifacts:
      - chatbots/nero_governance_assistant/nero_governance_assistant.py
      - shared/chat_store.py
      - shared/chat_export.py
      - shared/branding.py
      - shared/assets/caffe_nero_logo.png
      - chatbots/nero_governance_assistant/requirements.txt
    title: "Nero Governance Assistant"

  # ---------------- leaders (NERO_GOVERNANCE.APPS_LEADERS) ----------------
  marketing_assistant:
    type: streamlit
    identifier: {name: MARKETING_ASSISTANT, schema: APPS_LEADERS, database: NERO_GOVERNANCE}
    stage: streamlit_stage
    query_warehouse: NERO_BI_WH
    main_file: leaders/marketing_assistant/marketing_assistant.py
    artifacts: [leaders/marketing_assistant/marketing_assistant.py, leaders/persona_core.py, shared/chat_store.py, shared/chat_export.py, shared/branding.py, shared/assets/caffe_nero_logo.png, leaders/requirements.txt]
    title: "Nero Marketing Assistant"

  ops_assistant:
