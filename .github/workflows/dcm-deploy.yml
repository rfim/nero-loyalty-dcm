name: DCM Deploy

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Snowflake CLI
        run: pip install snowflake-cli

      - name: Configure Snowflake connection
        env:
          SNOWFLAKE_PRIVATE_KEY: ${{ secrets.SNOWFLAKE_PRIVATE_KEY }}
        run: |
          mkdir -p ~/.snowflake/keys
          echo "$SNOWFLAKE_PRIVATE_KEY" > ~/.snowflake/keys/rsa_key.p8
          chmod 600 ~/.snowflake/keys/rsa_key.p8
          snow connection add \
            --connection-name ci \
            --account "${{ secrets.SNOWFLAKE_ACCOUNT }}" \
            --user "${{ secrets.SNOWFLAKE_USER }}" \
            --role "${{ secrets.SNOWFLAKE_ROLE }}" \
            --warehouse "NERO_CI_WH" \
            --database "${{ secrets.SNOWFLAKE_DATABASE }}" \
            --schema "${{ secrets.SNOWFLAKE_SCHEMA }}" \
            --authenticator SNOWFLAKE_JWT \
            --private-key ~/.snowflake/keys/rsa_key.p8 \
            --default \
            --no-interactive

      - name: DCM plan
        run: snow dcm plan 'NERO_DB.PUBLIC.NERO_LOYALTY_PROJECT' -c ci

      - name: DCM deploy
        run: snow dcm deploy 'NERO_DB.PUBLIC.NERO_LOYALTY_PROJECT' -c ci --alias "ci-${{ github.sha }}"

      - name: Seed data contract
        run: python ingestion/build.py --seed -c ci

      - name: Set up Python for dbt
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dbt
        run: pip install "dbt-snowflake~=1.11.0"

      - name: Configure dbt profiles.yml (prod target, NERO_DBT_ROLE)
        run: |
          mkdir -p ~/.dbt
          cat > ~/.dbt/profiles.yml <<EOF
          nero_analytics:
            target: prod
            outputs:
              prod:
                type: snowflake
                account: ${{ secrets.SNOWFLAKE_ACCOUNT }}
                user: ${{ secrets.SNOWFLAKE_USER }}
                role: NERO_DBT_ROLE
                authenticator: snowflake_jwt
                private_key_path: /home/runner/.snowflake/keys/rsa_key.p8
                database: NERO_ANALYTICS
                warehouse: NERO_DBT_WH
                schema: gold
                threads: 4
          EOF

      - name: dbt deps
        working-directory: analytics
        run: dbt deps

      - name: dbt snapshot (prod)
        working-directory: analytics
        run: dbt snapshot --target prod

      - name: dbt build (prod)
        working-directory: analytics
        run: dbt build --target prod

      - name: Deploy Streamlit app
        working-directory: streamlit_app
        run: snow streamlit deploy nero_loyalty_pulse --replace --prune -c ci
