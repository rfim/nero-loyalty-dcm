version: 2

sources:
  - name: nero_validated
    description: >
      DCM-owned, contract-validated source tables. See
      sources/definitions/ingestion/validated.sql (generated by
      ingestion/build.py from ingestion/contract/) for their schema.
      dbt has SELECT-only access via NERO_DBT_ROLE — never writes here.
    database: NERO_DB
    schema: NERO_LOYALTY

    tables:
      - name: stores
        identifier: VALIDATED_STORES

      - name: loyalty_customers
        identifier: VALIDATED_LOYALTY_CUSTOMERS

      - name: transactions
        identifier: VALIDATED_TRANSACTIONS

      - name: loyalty_events
        identifier: VALIDATED_LOYALTY_EVENTS

      - name: release_pointer
        identifier: CONTROL_RELEASE_POINTER
