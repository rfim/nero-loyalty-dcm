version: 2

sources:
  - name: nero_validated
    description: >
      DCM-owned, contract-validated source tables (silver layer). See
      sources/definitions/ingestion/validated.sql (generated by
      ingestion/build.py from ingestion/contract/) for their schema.
      dbt has SELECT-only access via NERO_DBT_ROLE — never writes here.
    database: NERO_DB
    schema: '"01_SILVER"'

    tables:
      - name: stores
        identifier: VALIDATED_STORES

      - name: loyalty_customers
        identifier: VALIDATED_LOYALTY_CUSTOMERS

      - name: transactions
        identifier: VALIDATED_TRANSACTIONS

      - name: loyalty_events
        identifier: VALIDATED_LOYALTY_EVENTS

  - name: nero_control
    description: >
      DCM-owned control-plane tables. dbt has SELECT-only access to the
      release pointer, to know which batch is the current approved release.
    database: NERO_DB
    schema: '"02_CONTROL"'

    tables:
      - name: release_pointer
        identifier: CONTROL_RELEASE_POINTER
