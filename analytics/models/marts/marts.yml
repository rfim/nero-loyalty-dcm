version: 2

models:
  - name: mart_customer_loyalty_activity
    description: "Grain: one row per customer. PII-safe -- exposes customer_key (surrogate), never the raw customer_id."
    columns:
      - name: customer_key
        tests: [not_null, unique]

  - name: mart_store_daily_performance
    description: "Grain: one row per store + calendar date with any activity."
    tests:
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns: [performance_date, store_id]

  - name: mart_reward_redemption_daily
    description: "Grain: date, store, reward_id."
    tests:
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns: [redemption_date, store_id, reward_id]
