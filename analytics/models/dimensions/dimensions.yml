version: 2

models:
  - name: dim_customer_scd
    description: >
      Type 2 customer dimension for the one attribute that needs history
      (tier). Precision is snapshot-observed — accurate to dbt run cadence,
      not true source-effective time, since tier_change events don't carry
      old_tier/new_tier. See tier_effective_precision column.
    columns:
      - name: customer_key
        tests: [not_null, unique]
      - name: customer_id
        tests:
          - not_null:
              config:
                where: "customer_key not in ('-1', '-2')"
      - name: valid_from
        tests: [not_null]
      - name: valid_to
        tests: [not_null]

  - name: dim_date
    description: One row per calendar date, 2020-01-01 through 2030-12-31.
    columns:
      - name: date_key
        tests: [not_null, unique]
      - name: full_date
        tests: [not_null, unique]

  - name: dim_time
    description: One row per minute of the day (1440 rows).
    columns:
      - name: time_key
        tests: [not_null, unique]
      - name: minute_of_day
        tests: [not_null, unique]

  - name: dim_store
    description: Store dimension, Type 1 (no history), plus -1/-2 standard members.
    columns:
      - name: store_key
        tests: [not_null, unique]
      - name: store_id
        tests:
          - unique:
              config:
                where: "store_key not in ('-1', '-2')"

  - name: dim_reward
    description: >
      Shell dimension — no reward master source exists. Standard members
      only; do not invent reward names, types or point values here.
    columns:
      - name: reward_key
        tests: [not_null, unique]
