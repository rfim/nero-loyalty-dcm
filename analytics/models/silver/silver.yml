version: 2

models:
  - name: silver_stores
    description: One row per store. No aggregation, no surrogate keys.
    columns:
      - name: store_id
        tests: [not_null, unique]
      - name: store_format
        tests:
          - accepted_values:
              values: ["High street", "Drive-thru", "Travel"]

  - name: silver_loyalty_customers
    description: One row per customer, current tier only (history is dbt's, see snapshots).
    columns:
      - name: customer_id
        tests: [not_null, unique]
      - name: tier
        tests:
          - accepted_values:
              values: ["Bronze", "Silver", "Gold"]
      - name: home_store_id
        tests:
          - relationships:
              to: ref('silver_stores')
              field: store_id

  - name: silver_transactions
    description: One row per transaction. net_sales_amount is basket_total renamed.
    columns:
      - name: transaction_id
        tests: [not_null, unique]
      - name: store_id
        tests:
          - not_null
          - relationships:
              to: ref('silver_stores')
              field: store_id
      - name: customer_id
        tests:
          - relationships:
              to: ref('silver_loyalty_customers')
              field: customer_id
      - name: payment_type
        tests:
          - accepted_values:
              values: [Card, App, Cash]

  - name: silver_loyalty_events
    description: One row per loyalty event.
    columns:
      - name: event_id
        tests: [not_null, unique]
      - name: customer_id
        tests:
          - not_null
          - relationships:
              to: ref('silver_loyalty_customers')
              field: customer_id
      - name: store_id
        tests:
          - relationships:
              to: ref('silver_stores')
              field: store_id
      - name: event_type
        tests:
          - accepted_values:
              values: [signup, earn, redeem, tier_change]
