version: 2

models:
  - name: validated_stores
    description: "Bronze->silver, filtered by the store contract rules directly in SQL."
    columns:
      - name: store_id
        tests: [not_null, unique]
      - name: format
        tests:
          - accepted_values: {values: ["High street", "Drive-thru", "Travel"]}

  - name: validated_loyalty_customers
    description: "Bronze->silver, filtered by the loyalty_customers contract rules directly in SQL."
    columns:
      - name: customer_id
        tests: [not_null, unique]
      - name: tier
        tests:
          - accepted_values: {values: ["Bronze", "Silver", "Gold"]}
      - name: home_store_id
        tests:
          - relationships: {to: ref('validated_stores'), field: store_id}

  - name: validated_loyalty_events
    description: "Bronze->silver, filtered by the loyalty_events contract rules directly in SQL."
    columns:
      - name: event_id
        tests: [not_null, unique]
      - name: customer_id
        tests:
          - relationships: {to: ref('validated_loyalty_customers'), field: customer_id}
      - name: event_type
        tests:
          - accepted_values: {values: ["signup", "earn", "redeem", "tier_change"]}
      - name: store_id
        tests:
          - relationships: {to: ref('validated_stores'), field: store_id}

  - name: validated_transactions
    description: "Bronze->silver, filtered by the transactions contract rules directly in SQL. Incremental -- only new rows merge in per run."
    columns:
      - name: transaction_id
        tests: [not_null, unique]
      - name: store_id
        tests:
          - relationships: {to: ref('validated_stores'), field: store_id}
      - name: customer_id
        tests:
          - relationships: {to: ref('validated_loyalty_customers'), field: customer_id}
      - name: payment_type
        tests:
          - accepted_values: {values: ["Card", "App", "Cash"]}
