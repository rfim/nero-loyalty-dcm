name: nero_analytics
version: 1.0.0
config-version: 2
profile: nero_analytics

model-paths: ["models"]
snapshot-paths: ["snapshots"]
test-paths: ["tests"]
seed-paths: ["seeds"]
macro-paths: ["macros"]
clean-targets: ["target", "dbt_packages"]

vars:
  reporting_timezone: Europe/London
  late_arrival_lookback_days: 3

models:
  nero_analytics:
    staging:
      +schema: staging
      +materialized: view
    intermediate:
      +schema: intermediate
      +materialized: table
    dimensions:
      +schema: gold
      +materialized: table
    facts:
      +schema: gold
      +materialized: table
    marts:
      marketing:
        +schema: mart_marketing
      operations:
        +schema: mart_operations

snapshots:
  nero_analytics:
    +target_schema: snapshots
