name: nero_analytics
version: 1.0.0
config-version: 2
profile: nero_analytics

model-paths: ["models"]
snapshot-paths: ["snapshots"]
test-paths: ["tests"]
macro-paths: ["macros"]
clean-targets: ["target", "dbt_packages"]

vars:
  reporting_timezone: Europe/London
  late_arrival_lookback_days: 3

# Schema names are numbered (00_STAGING, 01_SNAPSHOTS, ...) for readability
# in Snowsight's alphabetical listing — Snowflake requires identifiers
# starting with a digit to be quoted, so schema quoting must be on, and the
# case here must exactly match the real schema name (quoted = case-sensitive).
quoting:
  database: false
  schema: true
  identifier: false

models:
  nero_analytics:
    staging:
      +schema: "00_STAGING"
      +materialized: view
    dimensions:
      +schema: "02_GOLD"
      +materialized: table
    facts:
      +schema: "02_GOLD"
      +materialized: table
    marts:
      marketing:
        +schema: "03_MART_MARKETING"
      operations:
        +schema: "04_MART_OPERATIONS"

snapshots:
  nero_analytics:
    +target_schema: "01_SNAPSHOTS"
