name: nero_analytics
version: 1.0.0
config-version: 2
profile: nero_analytics

model-paths: ["models"]
snapshot-paths: ["snapshots"]
test-paths: ["tests"]
macro-paths: ["macros"]
clean-targets: ["target", "dbt_packages"]

vars:
  reporting_timezone: Europe/London
  late_arrival_lookback_days: 3

# Schema names are numbered (00_SILVER, 01_SNAPSHOTS, ...) for readability
# in Snowsight's alphabetical listing — Snowflake requires identifiers
# starting with a digit to be quoted, so schema quoting must be on, and the
# case here must exactly match the real schema name (quoted = case-sensitive).
# NERO_ANALYTICS's own numbering restarts at 00 independently of NERO_DB's
# (00_STAGING/01_BRONZE there) -- see analytics/README.md for the full
# Staging/Bronze/Silver/Gold/Mart rename mapping across both databases.
quoting:
  database: false
  schema: true
  identifier: false

models:
  nero_analytics:
    bronze:
      +database: NERO_DB
      +schema: "01_BRONZE"
      +materialized: table
    silver:
      +schema: "00_SILVER"
      +materialized: view
    dimensions:
      +schema: "02_GOLD"
      +materialized: table
    facts:
      +schema: "02_GOLD"
      +materialized: table
    marts:
      marketing:
        +schema: "03_MART_MARKETING"
      operations:
        +schema: "04_MART_OPERATIONS"

snapshots:
  nero_analytics:
    +target_schema: "01_SNAPSHOTS"

# Logs every test's pass/fail into a real table (see account_setup/
# dbt_quality_log.sql) for the combined governance dashboard's Data
# Quality tab -- otherwise nothing querying Snowflake ever sees dbt's own
# test results.
on-run-end:
  - "{{ log_dbt_test_results(results) }}"
